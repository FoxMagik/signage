name: Update Calendar Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'announcements.json'
      - 'template_display.html'
      - 'build.py'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so pulls/rebases succeed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch ICS and rebuild index.html
        run: python build.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest remote changes first in case admin.html just wrote a commit
          git pull --rebase origin main || true
          
          # Force track all generated targets
          git add -f index.html display.html announcements.json
          
          git status
          
          # Only commit if actual diffs exist
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update signage display [skip ci]"
            git push origin main
            echo "Display successfully committed and pushed to main!"
          else
            echo "No diff detected in files."
          fi
