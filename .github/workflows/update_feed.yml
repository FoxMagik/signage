name: Update Calendar Feed

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour for menus/news
  workflow_dispatch:       # Allows manual "Run workflow" button
  push:
    paths:
      - 'announcements.json'  # Triggers immediately when you post from admin.html
      - 'template_display.html'
      - 'build.py'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch ICS and rebuild index.html
        run: python build.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html display.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update signage feed [skip ci]" && git push)
