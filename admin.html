<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signage Control Panel</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h2 { margin-bottom: 1.5rem; color: var(--accent); }
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-weight: 600; font-size: 0.95rem; }
    input, select, textarea {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: #fff;
      font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 1rem; font-weight: 600; text-align: center; }
  </style>
</head>
<body>

<div class="panel">
  <h2>Post to Signage Display</h2>
  
  <div class="form-group">
    <label>Entry Type</label>
    <select id="entryType" onchange="toggleType()">
      <option value="announcement">Announcement / Birthday</option>
      <option value="rss">Custom RSS Feed</option>
    </select>
  </div>

  <div class="form-group" id="groupHeadline">
    <label>Headline</label>
    <input type="text" id="headline" placeholder="e.g. Happy Birthday Mrs. Robinson!">
  </div>

  <div class="form-group" id="groupDetails">
    <label>Details / Message</label>
    <textarea id="details" rows="3" placeholder="e.g. From the 3rd Grade Team"></textarea>
  </div>

  <div class="form-group" id="groupRss" style="display:none;">
    <label>RSS Feed URL</label>
    <input type="url" id="rssUrl" placeholder="https://example.com/feed.xml">
  </div>

  <div class="row">
    <div class="form-group">
      <label>Card Theme / Background</label>
      <select id="theme">
        <option value="theme-navy">District Slate / Navy</option>
        <option value="theme-gold">Gold Announcement</option>
        <option value="theme-teal">Teal Highlight</option>
      </select>
    </div>
    <div class="form-group">
      <label>Display Duration (Seconds)</label>
      <input type="number" id="duration" value="15" min="5" max="60">
    </div>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Start Date</label>
      <input type="date" id="startDate">
    </div>
    <div class="form-group">
      <label>End Date (Expiration)</label>
      <input type="date" id="endDate">
    </div>
  </div>

  <button id="submitBtn" onclick="submitEntry()">Publish to Display</button>
  <div id="status"></div>
</div>

<script>
  // Set your repo details and token here
  const GITHUB_REPO = "YOUR_USERNAME/YOUR_REPO_NAME"; 
  const GITHUB_TOKEN = "github_pat_YOUR_TOKEN_HERE";
  const FILE_PATH = "announcements.json";

  // Pre-fill today's date
  document.getElementById("startDate").valueAsDate = new Date();

  function toggleType() {
    const type = document.getElementById("entryType").value;
    document.getElementById("groupRss").style.display = type === "rss" ? "flex" : "none";
    document.getElementById("groupHeadline").querySelector("label").textContent = type === "rss" ? "Feed Title" : "Headline";
  }

  async function submitEntry() {
    const btn = document.getElementById("submitBtn");
    const status = document.getElementById("status");
    btn.disabled = true;
    status.textContent = "Connecting to repository...";

    const newEntry = {
      type: document.getElementById("entryType").value,
      headline: document.getElementById("headline").value.trim(),
      details: document.getElementById("details").value.trim(),
      rssUrl: document.getElementById("rssUrl").value.trim(),
      theme: document.getElementById("theme").value,
      duration: parseInt(document.getElementById("duration").value, 10),
      startDate: document.getElementById("startDate").value,
      endDate: document.getElementById("endDate").value
    };

    if (!newEntry.headline) {
      alert("Please enter a headline or title.");
      btn.disabled = false;
      return;
    }

    try {
      // 1. Fetch current file & SHA
      const getUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_PATH}`;
      const getRes = await fetch(getUrl, {
        headers: { "Authorization": `Bearer ${GITHUB_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
      });

      let currentData = [];
      let sha = null;

      if (getRes.status === 200) {
        const fileJson = await getRes.json();
        sha = fileJson.sha;
        currentData = JSON.parse(atob(fileJson.content));
      }

      // 2. Append new item
      currentData.push(newEntry);

      // 3. Commit updated file
      const updateRes = await fetch(getUrl, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${GITHUB_TOKEN}`, "Accept": "application/vnd.github.v3+json" },
        body: JSON.stringify({
          message: `Add ${newEntry.type}: ${newEntry.headline} [via web admin]`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2)))),
          sha: sha
        })
      });

      if (updateRes.ok) {
        status.style.color = "#4ade80";
        status.textContent = "Success! Display update triggered. Refreshing Anthias soon.";
        setTimeout(() => location.reload(), 2500);
      } else {
        throw new Error(await updateRes.text());
      }
    } catch (err) {
      console.error(err);
      status.style.color = "#f87171";
      status.textContent = "Failed to publish. Check console or token permissions.";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
