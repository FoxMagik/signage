<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascension Signage Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2.5rem;
      max-width: 950px;
      margin: 0 auto;
    }
    h1 { color: var(--accent); margin-bottom: 0.5rem; }
    p.sub { color: var(--muted); margin-bottom: 2rem; }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
    }
    textarea { height: 100px; resize: vertical; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    button {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .item-list { list-style: none; margin-top: 1rem; }
    .item-card {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-delete {
      background: #ef4444;
      color: #fff;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>Signage Control Panel</h1>
  <p class="sub">Publish custom slides, flyers, schedules, and background graphics.</p>

  <!-- Auth Panel -->
  <div class="panel">
    <h3>Access Settings</h3>
    <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1rem;">Stored securely in this browser session.</p>
    <div class="grid-2">
      <div class="form-group">
        <label>Personal Access Token (or Proxy PIN)</label>
        <input type="password" id="authKey" placeholder="Paste GitHub PAT or District PIN">
      </div>
      <div class="form-group">
        <label>Optional Proxy URL (leave blank if using PAT)</label>
        <input type="url" id="proxyUrl" placeholder="https://worker.your-domain.workers.dev">
      </div>
    </div>
    <button type="button" onclick="saveAuth()" style="padding:0.5rem 1rem; font-size:0.9rem;">Save Credentials</button>
  </div>

  <!-- Create Slide Panel -->
  <div class="panel">
    <h3>Create New Slide</h3>
    <form id="slideForm">
      
      <div class="grid-2">
        <div class="form-group">
          <label>Slide Format</label>
          <select id="slideType" onchange="toggleFormFields()">
            <option value="announcement">Standard Announcement (Text + Optional Side Photo)</option>
            <option value="full-image">Full Image / Poster (Graphic fills screen)</option>
            <option value="bg-banner">Banner (Text over Custom Background Image)</option>
            <option value="rss">Live RSS News Feed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Display Duration (Seconds)</label>
          <input type="number" id="duration" value="15" min="5" max="120">
        </div>
      </div>

      <div class="form-group" id="groupHeadline">
        <label id="labelHeadline">Headline / Slide Title</label>
        <input type="text" id="headline" placeholder="e.g. Teacher Appreciation Week">
      </div>

      <div class="form-group" id="groupDetails">
        <label>Details / Body Text</label>
        <textarea id="details" placeholder="Enter announcement body text..."></textarea>
      </div>

      <div class="form-group" id="groupImage">
        <label id="labelImage">Image URL</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/photo-or-flyer.jpg">
      </div>

      <div class="form-group" id="groupRss" style="display:none;">
        <label>RSS Feed URL</label>
        <input type="url" id="rssUrl" placeholder="https://example.com/feed.xml">
      </div>

      <div class="grid-3">
        <div class="form-group" id="groupTheme">
          <label>Color Theme</label>
          <select id="theme">
            <option value="theme-navy">District Navy</option>
            <option value="theme-gold">Celebration Gold</option>
            <option value="theme-teal">Teal Highlight</option>
          </select>
        </div>
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="startDate">
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input type="date" id="endDate">
        </div>
      </div>

      <button type="submit" id="btnSubmit">Publish Slide</button>
    </form>
  </div>

  <!-- Active List Panel -->
  <div class="panel">
    <h3>Currently Scheduled Slides</h3>
    <ul class="item-list" id="slideList">Loading scheduled items...</ul>
  </div>

  <script>
    const REPO = "FoxMagik/signage";
    let fileSha = "";
    let currentAnnouncements = [];

    function saveAuth() {
      localStorage.setItem("signage_auth", document.getElementById("authKey").value.trim());
      localStorage.setItem("signage_proxy", document.getElementById("proxyUrl").value.trim());
      alert("Settings saved!");
      loadFeed();
    }

    function toggleFormFields() {
      const type = document.getElementById("slideType").value;
      const grpDetails = document.getElementById("groupDetails");
      const grpImage = document.getElementById("groupImage");
      const grpRss = document.getElementById("groupRss");
      const grpTheme = document.getElementById("groupTheme");
      const lblImage = document.getElementById("labelImage");
      const lblHeadline = document.getElementById("labelHeadline");

      grpDetails.style.display = (type === "full-image" || type === "rss") ? "none" : "block";
      grpRss.style.display = (type === "rss") ? "block" : "none";
      grpImage.style.display = (type === "rss") ? "none" : "block";
      grpTheme.style.display = (type === "full-image") ? "none" : "block";

      if (type === "full-image") {
        lblImage.textContent = "Full-Screen Poster Image URL (Required)";
        lblHeadline.textContent = "Slide Title (For Status Bar)";
      } else if (type === "bg-banner") {
        lblImage.textContent = "Background Image URL (Required)";
        lblHeadline.textContent = "Headline Text";
      } else {
        lblImage.textContent = "Side Image URL (Optional)";
        lblHeadline.textContent = "Headline Text";
      }
    }

    async function loadFeed() {
      const key = localStorage.getItem("signage_auth");
      if (!key) {
        document.getElementById("slideList").innerHTML = "<li>Please enter and save your token/PIN above.</li>";
        return;
      }
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/announcements.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Could not fetch announcements.json");
        const data = await res.json();
        fileSha = data.sha;
        currentAnnouncements = JSON.parse(atob(data.content));
        renderList();
      } catch (err) {
        document.getElementById("slideList").innerHTML = `<li>Error loading list: ${err.message}</li>`;
      }
    }

    function renderList() {
      const ul = document.getElementById("slideList");
      ul.innerHTML = "";
      if (!currentAnnouncements.length) {
        ul.innerHTML = "<li>No active custom slides found.</li>";
        return;
      }

      currentAnnouncements.forEach((item, idx) => {
        const li = document.createElement("li");
        li.className = "item-card";
        li.innerHTML = `
          <div>
            <strong>${item.headline}</strong> 
            <span style="color:var(--muted); font-size:0.85rem;">(${item.type} | ${item.duration}s | ${item.startDate || 'Now'} to ${item.endDate || 'Always'})</span>
          </div>
          <button class="btn-delete" onclick="deleteItem(${idx})">Delete</button>
        `;
        ul.appendChild(li);
      });
    }

    document.getElementById("slideForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = document.getElementById("slideType").value;
      const newItem = {
        type: type,
        headline: document.getElementById("headline").value.trim(),
        details: document.getElementById("details").value.trim(),
        imageUrl: document.getElementById("imageUrl").value.trim(),
        rssUrl: document.getElementById("rssUrl").value.trim(),
        theme: document.getElementById("theme").value,
        duration: parseInt(document.getElementById("duration").value, 10) || 15,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value
      };

      currentAnnouncements.push(newItem);
      await commitChanges("Add new slide via Admin");
    });

    async function deleteItem(idx) {
      if (!confirm("Delete this slide?")) return;
      currentAnnouncements.splice(idx, 1);
      await commitChanges("Delete slide via Admin");
    }

    async function commitChanges(msg) {
      const auth = localStorage.getItem("signage_auth");
      const proxy = localStorage.getItem("signage_proxy");
      const payload = {
        message: `${msg} [skip ci]`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(currentAnnouncements, null, 2)))),
        sha: fileSha
      };

      let resp;
      if (proxy) {
        resp = await fetch(proxy, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Pin": auth },
          body: JSON.stringify(payload)
        });
      } else {
        resp = await fetch(`https://api.github.com/repos/${REPO}/contents/announcements.json`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${auth}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
      }

      if (resp.ok) {
        alert("Published! Signage will update shortly.");
        document.getElementById("slideForm").reset();
        toggleFormFields();
        loadFeed();
      } else {
        alert("Failed to commit. Verify credentials.");
      }
    }

    // Initialize
    document.getElementById("authKey").value = localStorage.getItem("signage_auth") || "";
    document.getElementById("proxyUrl").value = localStorage.getItem("signage_proxy") || "";
    loadFeed();
  </script>
</body>
</html>
