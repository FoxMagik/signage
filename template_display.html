<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Digital Signage</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --teal: #2dd4bf;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Live Bar */
    header {
      height: 7vh;
      background: #0f172a;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3.5rem;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .live-clock {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Main Viewport Container */
    #slide-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 87vh;
      overflow: hidden;
    }

    /* Slide Defaults & Transitions */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, visibility 0.8s;
      padding: 2.5rem 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* Multi-Card Grids (Menus, Weather) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2.2rem;
      width: 100%;
      max-height: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 10px solid var(--accent);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }

    .card .meta {
      font-size: 1.15rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .card h2 {
      font-size: 1.85rem;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 1rem;
    }

    .menu-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      color: #e2e8f0;
      font-size: 1.3rem; /* Bumped menu text */
    }

    .menu-items li.special-item {
      color: var(--accent);
      font-weight: 600;
    }

    /* Hero Notice (Text Only or Side-by-Side) */
    .hero-layout {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 14px solid var(--accent);
      border-radius: 20px;
      padding: 3.5rem 4.5rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
    }

    /* Picture Hero Layout (NASA & Photo Announcements) */
    .hero-media-layout {
      display: flex;
      gap: 4rem;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .hero-media-layout img {
      max-width: 55%;
      height: 100%;
      max-height: 72vh;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.1);
    }

    .hero-media-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-height: 100%;
    }

    /* Background Themes */
    .slide.theme-navy .hero-layout {
      background: #1e293b;
      border-left-color: var(--accent);
    }

    .slide.theme-gold .hero-layout {
      background: linear-gradient(145deg, #1e1b4b, #311042);
      border-left-color: var(--gold);
    }
    .slide.theme-gold .hero-tag {
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
    }

    .slide.theme-teal .hero-layout {
      background: linear-gradient(145deg, #0f2b38, #064e3b);
      border-left-color: var(--teal);
    }
    .slide.theme-teal .hero-tag {
      background: rgba(45, 212, 191, 0.2);
      color: var(--teal);
    }

    /* Footer Status Bar */
    footer {
      height: 6vh;
      background: #070a10;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 3.5rem;
      color: var(--muted);
      font-size: 1.1rem;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" id="display-channel-title">Ascension Signage Network</div>
    <div class="live-clock" id="clock">12:00 PM</div>
  </header>

  <main id="slide-viewport">
{{SLIDES_HTML}}
  </main>

  <footer>
    <div id="status-title">Active Feed Loop</div>
    <div id="status-sync">{{BUILD_TIMESTAMP}}</div>
  </footer>

  <script>
    // Live Clock Display
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { 
        hour: 'numeric', 
        minute: '2-digit' 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Slide Carousel Engine
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    let timer = null;

    function showSlide(index) {
      if (!slides.length) return;

      slides.forEach(s => s.classList.remove('active'));
      const activeSlide = slides[index];
      activeSlide.classList.add('active');

      // Update Channel Title from slide attribute
      const title = activeSlide.getAttribute('data-title') || 'Ascension Signage';
      document.getElementById('display-channel-title').textContent = title;

      // Extract duration or default to 15 seconds
      const durationSec = parseInt(activeSlide.getAttribute('data-duration'), 10) || 15;

      clearTimeout(timer);
      timer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      }, durationSec * 1000);
    }

    if (slides.length > 0) {
      showSlide(0);
    }

    // Refresh display page every 15 minutes to pick up fresh GitHub builds
    setTimeout(() => {
      window.location.reload();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
