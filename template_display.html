<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Digital Signage</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --teal: #2dd4bf;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Live Bar */
    header {
      height: 7vh;
      background: #0f172a;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .live-clock {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Main Viewport Container */
    #slide-viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 88vh;
      overflow: hidden;
    }

    /* Slide Defaults & Transitions */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, visibility 0.8s;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* Layout 1: Multi-Card Grids (Menus, Weather, RSS) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      width: 100%;
      max-height: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 8px solid var(--accent);
      border-radius: 12px;
      padding: 1.8rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    .card .meta {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
    }

    .card h2 {
      font-size: 1.6rem;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 0.8rem;
    }

    .menu-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: #e2e8f0;
      font-size: 1.15rem;
    }

    .menu-items li {
      line-height: 1.4;
    }

    .menu-items li.special-item {
      color: var(--accent);
    }

    /* Layout 2: Single Hero Notice (Announcements, Celebrations) */
    .hero-layout {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 12px solid var(--accent);
      border-radius: 16px;
      padding: 4rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .hero-content {
      max-width: 90%;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .hero-content h2 {
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: #fff;
    }

    /* Background Themes */
    .slide.theme-navy .hero-layout {
      background: #1e293b;
      border-left-color: var(--accent);
    }

    .slide.theme-gold .hero-layout {
      background: linear-gradient(145deg, #1e1b4b, #311042);
      border-left-color: var(--gold);
    }
    .slide.theme-gold .hero-tag {
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
    }

    .slide.theme-teal .hero-layout {
      background: linear-gradient(145deg, #0f2b38, #064e3b);
      border-left-color: var(--teal);
    }
    .slide.theme-teal .hero-tag {
      background: rgba(45, 212, 191, 0.2);
      color: var(--teal);
    }

    /* Footer Status Bar */
    footer {
      height: 5vh;
      background: #070a10;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 3rem;
      color: var(--muted);
      font-size: 0.95rem;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" id="display-channel-title">Ascension Signage Network</div>
    <div class="live-clock" id="clock">12:00 PM</div>
  </header>

  <main id="slide-viewport">
{{SLIDES_HTML}}
  </main>

  <footer>
    <div id="status-title">Active Feed Loop</div>
    <div id="status-sync">{{BUILD_TIMESTAMP}}</div>
  </footer>

  <script>
    // Live Clock Display
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { 
        hour: 'numeric', 
        minute: '2-digit' 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Slide Carousel Engine
    const slides = document.querySelectorAll('.slide');
    let currentIndex = 0;
    let timer = null;

    function showSlide(index) {
      if (!slides.length) return;

      slides.forEach(s => s.classList.remove('active'));
      const activeSlide = slides[index];
      activeSlide.classList.add('active');

      // Update Channel Title from slide attribute
      const title = activeSlide.getAttribute('data-title') || 'Ascension Signage';
      document.getElementById('display-channel-title').textContent = title;

      // Extract duration or default to 15 seconds
      const durationSec = parseInt(activeSlide.getAttribute('data-duration'), 10) || 15;

      clearTimeout(timer);
      timer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      }, durationSec * 1000);
    }

    if (slides.length > 0) {
      showSlide(0);
    }

    // Refresh display page every 15 minutes to pick up fresh GitHub builds
    setTimeout(() => {
      window.location.reload();
    }, 15 * 60 * 1000);
  </script>
</body>
</html>
